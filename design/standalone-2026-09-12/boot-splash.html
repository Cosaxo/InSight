<script>
/* Standalone boot: the two generated bundles are inlined above (deferred, so they run
   in order after React and the DOM). Fires the same late-modules event the fetch boot did. */
(function () {
  var t0 = performance.now();
  function done() {
    var b = window.__IS_BUNDLE || {};
    window.dispatchEvent(new CustomEvent('is:late-modules'));
    console.log('[boot] standalone bundle, ' + ((b.core || 0) + (b.late || 0)) + ' modules (built ' + String(b.built).slice(0, 10) + ') \u00b7 ' + Math.round(performance.now() - t0) + 'ms');
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', done, { once: true }); else done();
})();
</script>

<script>
// Startup module check — a script that fails to load would otherwise vanish
// silently behind the window.X && guards. Polls for up to 15s (the boot can be
// waiting on the network), then reports anything missing loudly instead of
// rendering a quietly-empty app.
(function () {
  var MODS = ['IS_DATA','SCENES','DUELS','DAILYQ','WORLD_TOPICS','SUBTOPICS','LEARN','FEEDREAD','MapLens','MapAnchors','MapTabLayout','WPAL','RMCore','IS_TESTS','useTweaks','IOSDevice','DailySplit','MirrorTab','WorldFeed','LEARN_FEED','LMStreak','MapTab','MTBranchChips','MirrorFieldBody','GroupsMirrorBody','GroupDailyBody','DuoBody','ProfileOverlay','TestOverlay','TestResultCard','SearchOverlay','PersonOverlay','CityOverlay','PersonMindMap','DemographicsCard','CompareBreakdown','RelationshipMapOverlay','ExplainSheet','bindSwipeBack','MirrorLensRow','PATHS','PathsCard','PULSE','PulseCard','PulseTrends','TYPEMIX','TypeMixCard','WF_PAID','PAT','PatternsTab','QMAP','QuestionMap'];
  var tries = 0;
  var t = setInterval(function () {
    var missing = MODS.filter(function (m) { return window[m] == null; });
    if (!missing.length) { clearInterval(t); return; }
    if (++tries < 15) return; // the boot may still be fetching
    clearInterval(t);
    console.error('[InSight] modules failed to load:', missing.join(', '));
    var el = document.createElement('div');
    el.style.cssText = 'position:fixed;left:12px;right:12px;bottom:12px;z-index:99999;background:#7f1d1d;color:#fff;font:12px/1.5 monospace;padding:10px 14px;border-radius:10px;';
    el.textContent = 'Modules failed to load: ' + missing.join(', ');
    document.body.appendChild(el);
  }, 1000);
})();
</script>
