<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=Spectral:ital,wght@0,400;0,500;1,400;1,500&display=swap">
  <style>
    :root{--surface:oklch(0.965 0.004 75);--surface-2:oklch(0.994 0.0025 80);--surface-3:oklch(0.936 0.005 74);--rule:oklch(0.905 0.006 74);--ink:oklch(0.216 0.011 70);--ink-2:oklch(0.41 0.011 68);--ink-3:oklch(0.472 0.010 68);--accent:oklch(0.52 0.14 40);--accent-ink:color-mix(in oklch,oklch(0.52 0.14 40),oklch(0.216 0.011 70) 12%);--sans:'Hanken Grotesk',-apple-system,system-ui,sans-serif;--serif:'Spectral',Georgia,'Times New Roman',serif}
    body{margin:0;background:var(--surface);color:var(--ink);font-family:var(--sans);font-size:14px;-webkit-font-smoothing:antialiased}
    a{color:var(--accent-ink)} a:hover{color:var(--ink)}
    .pt-kick{font-size:12px;font-weight:750;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
    .pt-cat{display:inline-flex;align-items:center;font-size:12px;font-weight:750;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:999px}
    .pt-info{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--rule);background:var(--surface-2);color:var(--ink-3);font-family:var(--serif);font-style:italic;font-size:15px;line-height:1;display:inline-flex;align-items:center;justify-content:center;padding:0 0 2px}
    .pt-info.is-on{background:var(--ink);border-color:var(--ink);color:var(--surface)}
    .pt-topic{position:relative;flex:none;display:inline-flex;align-items:center;height:44px;border:1px solid var(--rule);border-radius:999px;background:var(--surface-2);color:var(--ink);padding:0 14px;font-size:12.5px;font-weight:600;white-space:nowrap;gap:6px}
    .pt-topic.is-on{border-color:var(--ink);background:var(--ink);color:var(--surface)}
    .pt-topic .chev{width:5px;height:5px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:translateY(-1.5px) rotate(45deg);opacity:.7}
    .pt-you{flex:none;display:inline-flex;align-items:center;gap:7px;height:44px;border:1px solid var(--rule);border-radius:999px;background:var(--surface-2);color:var(--ink-2);padding:0 13px;font-size:12.5px;font-weight:650}
    .pt-you .sw{width:26px;height:14px;border-radius:999px;background:var(--rule);position:relative}
    .pt-you .sw i{position:absolute;top:2px;left:2px;width:10px;height:10px;border-radius:50%;background:var(--surface-2)}
    .pt-you.is-on{border-color:oklch(0.52 0.14 282);color:var(--ink)}
    .pt-you.is-on .sw{background:oklch(0.52 0.14 282)} .pt-you.is-on .sw i{left:14px}
    .qm-read{display:flex;flex-direction:column;justify-content:center;border-top:1px solid var(--rule);padding:16px 2px 4px}
    .qm-qhead{display:flex;align-items:center;gap:8px}
    .qm-yours{margin-left:auto;font-size:12px;font-weight:700;color:var(--accent-ink)}
    .qm-prompt{font-family:var(--serif);font-size:21px;font-weight:500;line-height:1.22;color:var(--ink);margin:9px 0 0;text-wrap:pretty}
    .qm-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
    .qm-chip{display:inline-flex;align-items:center;gap:7px;border:1.4px solid var(--rule);background:var(--surface);border-radius:999px;padding:0 12px;height:44px;font-size:13.5px;font-weight:650;color:var(--ink)}
    .qm-chip.is-on{border-color:var(--ink);background:var(--ink);color:var(--surface)}
    .qm-chip .dot{width:8px;height:8px;border-radius:50%;flex:none}
    .qm-chip img{width:28px;height:28px;border-radius:50%;object-fit:cover;background:var(--surface-3)}
    .qm-chip.more{border-style:dashed;color:var(--ink-3)}
    .qm-says{display:flex;flex-direction:column;gap:14px;margin-top:16px;padding-top:14px;border-top:1px solid color-mix(in oklch,var(--rule),transparent 40%)}
    .qm-say{display:flex;flex-direction:column;gap:7px}
    .qm-saytext{font-size:13px;line-height:1.42;color:var(--ink-2);text-wrap:pretty}
    .qm-saytext b{font-weight:800;color:var(--ink)}
    .qm-saybar{position:relative;display:block;height:9px;border-radius:999px;background:color-mix(in oklch,var(--rule),var(--surface) 50%);overflow:hidden}
    .qm-saybar i{position:absolute;left:0;top:0;bottom:0;border-radius:999px}
    .qm-saybar em{position:absolute;top:-2px;bottom:-2px;width:2px;border-radius:1px;background:color-mix(in oklch,var(--ink),var(--surface) 30%)}
    .qm-base{position:relative;display:block;height:15px;margin-top:2px}
    .qm-base > span{position:absolute;transform:translateX(-50%);font-size:12px;font-weight:650;color:var(--ink-3);white-space:nowrap}
    .qm-foot{font-size:12px;font-weight:650;color:var(--ink-3);font-variant-numeric:tabular-nums}
    .qm-break{font-size:12.5px;font-weight:750;color:var(--accent-ink)}
    .qm-idle{display:flex;align-items:baseline;gap:11px;padding:6px 2px}
    .qm-idle b{font-size:34px;font-weight:800;line-height:.92;letter-spacing:-.02em;color:var(--ink);font-variant-numeric:tabular-nums;flex:none}
    .qm-idle span{font-size:13px;font-weight:600;line-height:1.4;color:var(--ink-2);text-wrap:pretty}
    .ln-key{display:flex;flex-wrap:wrap;gap:6px 14px;padding:12px 4px 4px;font-size:12px;font-weight:600;color:var(--ink-2)}
    .ln-key>span{display:inline-flex;align-items:center;gap:6px}
    .k-dot{width:8px;height:8px;border-radius:50%;background:var(--ink)} .k-ring{width:8px;height:8px;border-radius:50%;border:1.4px solid var(--ink);box-sizing:border-box}
    .k-line{width:18px;height:0;border-top:1.6px solid var(--ink)} .k-dash{width:18px;height:0;border-top:1.6px dashed var(--ink)}
    .k-you{width:8px;height:8px;border-radius:50%;background:oklch(0.52 0.14 282)}
    .k-beads{display:inline-flex;gap:2px} .k-beads i{width:6px;height:6px;border-radius:50%;border:1.2px solid var(--ink);box-sizing:border-box}
    .note{font-size:11.5px;font-weight:600;color:var(--ink-3);text-wrap:pretty;padding-top:8px;border-top:1px solid color-mix(in oklch,var(--rule),transparent 30%);margin-top:10px}
    .row{display:flex;align-items:center;gap:8px;min-height:44px}
  </style>
</helmet>
