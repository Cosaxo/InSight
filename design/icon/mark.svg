<!-- InSight app mark — the iris (D300). Source of truth for every launcher
     icon and the Play feature graphic. Regenerate the rasters with:
     node scripts/gen-icons.mjs

     The mark is still the Mirror in one glyph — you at the pupil, the
     people your answers are read against arranged around you — but the
     crowd now wears the app's own seven accent hues (styles.css
     --c-today/-around/-world/-city/-groups/-people/-likeness), one dot
     per hue, connected by the hexagon-and-spokes lattice from the
     2026-08-26 identity canvas (design/identity-2026-08-26/).

     TWO groups, one geometry. The dot colours cannot be shared between a
     paper ground and an ink ground: converting the same oklch token for
     both leaves the dots muddy on ink, so the identity canvas specifies a
     brightened tile palette (and nudges three hues: 235→240, 282→288,
     8→12).
       - id "mark"       paper contexts — the Play feature graphic
                         (scripts/gen-feature-graphic.mjs), radii tuned
                         for its ~190 px render
       - id "mark-tile"  the ink launcher tile — every icon
                         scripts/gen-icons.mjs writes, radii one step
                         fatter because the worst case is mdpi at 48 px
     Both extractors slice from the group's opening tag to the first
     closing-group tag after it, so two rules hold this file: each group
     stays flat (no nested group, fills on the elements), and THIS COMMENT
     never spells either tag out in angle brackets — the first draft did,
     indexOf matched the comment instead of the element, and the icons
     rendered as pure ink until the blank-render tripwire refused them.
     The rect and the translate wrapper around the tile group are
     preview-only and stay outside the extracted payload on purpose.

     Colours are today's tokens converted oklch→sRGB with CSS Color 4
     gamut mapping (chroma reduction), i.e. the same values Chrome
     resolves the stylesheet to — not eyeballed, and not clamped. The
     previous mark's sienna #b34f2a inverted to oklch(0.55 0.14 40): the
     token had been retuned to 0.52 after the mark was cut and nothing
     noticed, which is this repo's hand-maintained-figure failure wearing
     colour. Ink #1d1914 = --ink oklch(0.216 0.011 70), unchanged.

     Everything stays inside a centred circle of radius 39.5 in this
     100-box; scripts/gen-icons.mjs scales it so the adaptive foreground
     keeps to Android's 66/108 safe zone. Below ~24 px the lattice
     muddies — small surfaces (favicon, in-app header) use the compact
     hexagon+pupil variant committed at public/favicon.svg instead; the
     rasters this file feeds never render that small. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 100" width="210" height="100">
  <g id="mark">
    <path d="M50 33 L64.7 41.5 L64.7 58.5 L50 67 L35.3 58.5 L35.3 41.5 Z M50 33 L50 16 M64.7 41.5 L82.3 39.5 M64.7 58.5 L82.3 60.5 M50 67 L50 84 M35.3 58.5 L17.7 60.5 M35.3 41.5 L17.7 39.5" fill="none" stroke="#8b857f" stroke-width="1.8" stroke-linejoin="round"/>
    <circle cx="50" cy="16" r="5" fill="#a94620"/>
    <circle cx="70" cy="22.5" r="5" fill="#8c6400"/>
    <circle cx="82.3" cy="39.5" r="5" fill="#0a7e3a"/>
    <circle cx="82.3" cy="60.5" r="5" fill="#007b7c"/>
    <circle cx="70" cy="77.5" r="5" fill="#0072a5"/>
    <circle cx="50" cy="84" r="5" fill="#5e5bb6"/>
    <circle cx="30" cy="77.5" r="5" fill="#a94620"/>
    <circle cx="17.7" cy="60.5" r="5" fill="#8c6400"/>
    <circle cx="17.7" cy="39.5" r="5" fill="#0a7e3a"/>
    <circle cx="30" cy="22.5" r="5" fill="#007b7c"/>
    <circle cx="50" cy="33" r="5.5" fill="#5e5bb6"/>
    <circle cx="64.7" cy="41.5" r="5.5" fill="#a83f59"/>
    <circle cx="64.7" cy="58.5" r="5.5" fill="#8c6400"/>
    <circle cx="50" cy="67" r="5.5" fill="#0072a5"/>
    <circle cx="35.3" cy="58.5" r="5.5" fill="#a94620"/>
    <circle cx="35.3" cy="41.5" r="5.5" fill="#007b7c"/>
    <circle cx="50" cy="50" r="7.5" fill="#1d1914"/>
  </g>
  <g transform="translate(110 0)">
    <rect x="0" y="0" width="100" height="100" rx="24" fill="#1d1914"/>
    <g id="mark-tile">
      <path d="M50 33 L64.7 41.5 L64.7 58.5 L50 67 L35.3 58.5 L35.3 41.5 Z M50 33 L50 16 M64.7 41.5 L82.3 39.5 M64.7 58.5 L82.3 60.5 M50 67 L50 84 M35.3 58.5 L17.7 60.5 M35.3 41.5 L17.7 39.5" fill="none" stroke="#76706a" stroke-width="2.2" stroke-linejoin="round"/>
      <circle cx="50" cy="16" r="5.5" fill="#cf6139"/>
      <circle cx="70" cy="22.5" r="5.5" fill="#cd9c1f"/>
      <circle cx="82.3" cy="39.5" r="5.5" fill="#40a35c"/>
      <circle cx="82.3" cy="60.5" r="5.5" fill="#009b9b"/>
      <circle cx="70" cy="77.5" r="5.5" fill="#0089c9"/>
      <circle cx="50" cy="84" r="5.5" fill="#7e6cd9"/>
      <circle cx="30" cy="77.5" r="5.5" fill="#cf6139"/>
      <circle cx="17.7" cy="60.5" r="5.5" fill="#cd9c1f"/>
      <circle cx="17.7" cy="39.5" r="5.5" fill="#40a35c"/>
      <circle cx="30" cy="22.5" r="5.5" fill="#009b9b"/>
      <circle cx="50" cy="33" r="6" fill="#7e6cd9"/>
      <circle cx="64.7" cy="41.5" r="6" fill="#d4556c"/>
