ext {
    minSdkVersion = 24
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'
    // Play Integrity — D29's Android attestation, and the Device Recall
    // bits that carry the one-account-per-device-per-month bound.
    playIntegrityVersion = '1.4.0'
    // @capacitor-firebase/authentication ships each provider's SDK behind
    // an opt-in flag. Without this the Google Sign-In dependency is never
    // pulled in and FirebaseAuthentication.signInWithGoogle() fails at
    // runtime — which is the only way an anonymous account can be
    // upgraded without losing its uid and history (decision D3).
    rgcfaIncludeGoogle = true
}