# The checks that must pass before backend code reaches production.
#
# Called by BOTH ci.yml (on every PR) and firebase-deploy.yml (before the
# apply). Previously the deploy waited only on the rules suite, so a push
# that broke meetsKFloor, the duel-reveal path or account deletion
# deployed while ci.yml went red in parallel — and the k-floor is the
# mechanism the product's privacy claim rests on.
#
# Deliberately NOT here: lint, the bundle budget, the npm audit and the
# Android build. Each would let something unrelated to backend
# correctness block an emergency rules fix — the audit especially, since
# it is a live registry call in an otherwise deterministic pipeline and an
# overnight upstream advisory could hold a hotfix.
name: Backend checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  functions-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci --prefix functions
      - run: npm run build --prefix functions
      # pure.ts holds the k-anon floor, reveal and streak math. Its tests
      # existed but nothing ran them, so a regression there merged green.
      - run: npm run test --prefix functions
      # Every function must carry explicit memory/timeout: the gen-2
      # defaults (256MiB / 60s) are where the aggregators and deleteAccount
      # died. Reads the compiled output, so it runs after the build.
      - run: npm run check:fn-runtime
      # Every callable either demands App Check attestation or is named in
      # the script's exemption list with the reason it cannot. Omitting
      # `enforceAppCheck` is silent — the function builds, deploys, passes
      # every test and serves any caller on the internet — and App Check is
      # the only control between the public surface and unlimited free
      # anonymous accounts (D3). Backend rather than client for the same
      # reason as check:deploy-targets: it is a statement about what
      # production accepts. Source scan, so no build and no root
      # node_modules; it CANNOT read the compiled output, because
      # ENFORCE_APP_CHECK is false under FUNCTIONS_EMULATOR and that is what
      # check:fn-runtime sets.
      - run: npm run check:appcheck
      # Every exported function must appear in firebase-deploy.yml's --only
      # list, or it builds, passes every test, goes green — and is never
      # deployed. This gate existed and ran nowhere for its whole life: it
      # was named in README and CLAUDE.md as one of the project's checks,
      # and its only caller was a checkbox in the PR template. It belongs
      # here rather than in ci.yml because it is a statement about what
      # reaches production. Parses source with a regex, so it needs no
      # build and no root node_modules.
      - run: npm run check:deploy-targets
      # The aggregate trigger validates catalog `entity` keys against
      # CATALOG_MAX_ENTITY, which must equal the committed catalogue's
      # count — this check cross-checks the two, so it guards the deploy,
      # not just the client (ci.yml runs it too). Node stdlib only.
      - run: npm run check:pokedex
      # …and CATALOG_MAX_ELEMENT against public/elements.txt — the same
      # trigger-side ceiling, second contiguous-key domain.
      - run: npm run check:elements
      # Same for the QID-keyed domains: catalogKeys.ts is what the deployed
      # trigger accepts, and it must equal the committed catalogue files
      # exactly — absence included.
      - run: npm run check:catalogs
      # logicSubmitV2 scores against the form the deployed generator copy
      # produces; it must be byte-identical to the client's generator or
      # the server marks puzzles the player never saw (D57). Node stdlib
      # only, no root node_modules.
      - run: npm run check:logic-sync
      # The seed callable compiles functions/src/v2content.ts in, so drift
      # between it and /content is a statement about what reaches
      # production: a hand edit to the generated file, or a /content change
      # without a regen, ships a bank nobody reviewed. Regenerates in
      # memory and compares bytes. Node stdlib only, no root node_modules.
      - run: npm run check:content
      # The CALL rubric's two copies, and a dry run of every rubric in the
      # bank the same seed callable ships (D194). Deploy-path for both
      # halves: a drifted copy makes the deployed resolver and the shipped
      # card disagree about what a test means, and an unexecutable rubric
      # deploys as a call nothing can ever grade — which costs everyone who
      # answered it their guess. Imports TypeScript directly, so it needs
      # Node ≥22.18; no root node_modules.
      - run: npm run check:calls
      # The four closed anchor vocabularies. Same argument as the catalogue
      # gates above: the deployed trigger buckets on these exact strings, so
      # a label the client can send and pure.ts does not know folds into no
      # bucket — the answer writes and is never counted. The length rule is
      # the load-bearing one: a vocabulary shorter than the bucket cap cannot
      # be exhausted by a caller, which is the property that closes D47's
      # slot-exhaustion hole. Node stdlib only.
      - run: npm run check:anchors

  rules-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # firebase-tools 15 requires Java 21+ for the Firestore emulator;
      # the runner's default JDK is older.
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
      # PER-JOB SUFFIX, and restore-keys, and both halves matter.
      #
      # This job and the e2e job below had a BYTE-IDENTICAL key and both save
      # on it, so which jar set the cache ended up holding was decided by
      # whichever job finished first — and they download different emulators
      # (firestore+storage here, firestore+auth+functions there). Adding
      # restore-keys without the suffix would only have made the racy entry
      # stickier.
      #
      # Keyed on firebase-tools' own downloadable-emulator manifest rather
      # than the whole root lockfile: the jars track that file, so an
      # unrelated dependency bump was re-downloading ~195 MB in each of two
      # jobs. It is in the workspace by then — `npm ci` runs above.
      - name: Cache Firestore emulator
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-rules-${{ hashFiles('node_modules/firebase-tools/lib/emulator/downloadableEmulatorInfo.json') }}
          restore-keys: firebase-emulators-rules-
      # Firestore + Storage rules (storage.rules was previously untested
      # AND undeployed).
      - run: npm run test:rules

  # The whole v2 core loop against real emulated functions: anon auth →
  # seed → vote → aggregate trigger → k-floor → groups → sealed reveal.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          # BOTH lockfiles, because this job installs both trees. Keyed on
          # the root one alone, a /functions-only lockfile change left a
          # stale ~/.npm that still restored on the primary key and was
          # never re-saved — so the backend's package cache silently stopped
          # refreshing. firebase-deploy.yml already does this, with the
          # comment explaining why; this job was the one that missed it.
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - run: npm ci
      - run: npm ci --prefix functions
      # The functions emulator loads functions/lib — build first.
      - run: npm run build --prefix functions
      # firebase-tools 15 requires Java 21+ for the Firestore emulator.
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
      # Its own key — see the rules job above for why sharing one was a race.
      - name: Cache Firebase emulators
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-e2e-${{ hashFiles('node_modules/firebase-tools/lib/emulator/downloadableEmulatorInfo.json') }}
          restore-keys: firebase-emulators-e2e-
      - run: npm run test:e2e
      # Right-to-erasure: observes leftovers with the admin SDK (rules
      # bypassed), because reading as another user cannot tell "deleted"
      # from "permission-denied".
      - run: npm run test:e2e:erasure
      # The moderation loop's transport layer — the callables, the
      # moderator gate, the out-of-queue refusal, the advisory-mode
      # guarantee — is executable only here, against the real functions
      # emulator (docs/MODERATION.md, D22).
      - run: npm run test:e2e:moderation
