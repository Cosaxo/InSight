# Push the App Store listing, age rating and privacy label from the repo.
#
# WHY THIS EXISTS. Everything it pushes was already in the repo, reviewed
# and gated — design/store/listing.json against both stores' character
# limits, design/store/app-privacy.json against docs/STORE-FORMS.md. What
# was missing was a way to run scripts/asc-push.mjs without first putting
# an App Store Connect private key on a laptop. The key is already a
# repository secret because the release workflow needs it; this reuses it
# rather than asking for a second copy in a second place.
#
# Cheap, unlike ios-release.yml: ubuntu, no Xcode, well under a minute. The
# reason it is still dispatch-only is not cost — it is that this writes to
# a live App Store listing, and a push trigger would mean every commit
# touching listing.json edited the store.
#
# DRY RUN IS THE DEFAULT and the default is the point. With apply
# unticked it prints the exact diff — every field, every privacy row it
# would add or remove — and changes nothing. Read that before ticking.
#
# What this does NOT write, and why each is different:
#   - the privacy nutrition label. NOT a choice — Apple's API has no App
#     Privacy resource at all (D73). Selecting `privacy` prints the form,
#     row by row, in the order App Store Connect asks; you copy it across.
#     Fifteen minutes, and nothing recalled from memory.
#   - screenshots. Uploading them needs captures on disk, and they are
#     gitignored build output — the Screenshots workflow captures and
#     uploads in one run. Selecting `screenshots` here only reports.
#   - submitting for review — irreversible and outward-facing, so it should
#     cost a deliberate human click in App Store Connect
#
# Secrets: ASC_KEY_ID, ASC_ISSUER_ID, ASC_PRIVATE_KEY — the same three
# ios-release.yml uses. docs/IOS-RELEASE.md § 1 says where they come from
# and why the key must be Admin role.

name: App Store metadata

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Write to App Store Connect (unticked = show the diff, change nothing)"
        type: boolean
        default: false
      what:
        description: "Which parts to push"
        type: choice
        options: ["all", "text", "age-rating", "privacy (report only)", "screenshots (report only)"]
        default: "all"

permissions:
  contents: read

concurrency:
  group: asc-metadata
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The same gates that guard a PR, run again here against what is
      # actually about to be pushed. check:store-listing holds every field
      # inside its store limit; check:store-forms holds the privacy JSON
      # equal to the prose a human reviewed; check:public-copy refuses the
      # retired pre-D98 privacy model in copy a user reads. Failing here
      # costs seconds; failing after the PATCH means a live listing is
      # already wrong.
      #
      # public-copy is on this step because of THIS push. Its own header
      # records the episode: listing.json had already been sent to App
      # Store Connect carrying "Your answers are owner-only. The database
      # rules enforce it." The gate that exists because of that lived only
      # on ci.yml, and this workflow is workflow_dispatch — it pushes
      # whatever ref it is dispatched on. Measured: with that sentence back
      # in the description, store-listing and store-forms both pass and
      # public-copy is the only thing that fails.
      - name: Gate the content before pushing it
        run: |
          npm run check:store-listing
          npm run check:store-forms
          npm run check:public-copy

      - name: Push to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          WHAT: ${{ inputs.what }}
          APPLY: ${{ inputs.apply }}
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_PRIVATE_KEY" ]; then
            echo "::error::The three ASC_* secrets are not all set — see docs/IOS-RELEASE.md § 1."
            exit 1
          fi

          case "$WHAT" in
            all)                         MODE="--all" ;;
            text)                        MODE="" ;;
            age-rating)                  MODE="--age-rating" ;;
            "privacy (report only)")     MODE="--privacy" ;;
            "screenshots (report only)") MODE="--screenshots" ;;
            *) echo "::error::unknown selection '$WHAT'"; exit 1 ;;
          esac

          # Neither report-only selection takes --apply. For privacy there is
          # nothing to apply to (D73); for screenshots there is nothing on
          # disk to upload, because the captures are gitignored build output
          # and the Screenshots workflow captures and uploads in one run.
          # Passing it anyway would be a lie in the log rather than an error.
          #
          # The empty branch below reads like an errexit hazard and is not:
          # bash exempts a whole AND-OR list from `set -e`, so a false test
          # as the last statement of a case branch does not fail the step.
          # Measured under `bash -e` rather than reasoned about, because the
          # default here is APPLY=false and getting it wrong would break the
          # common path.
          case "$MODE" in
            --privacy|--screenshots) ;;
            *) [ "$APPLY" = "true" ] && MODE="$MODE --apply" ;;
          esac

          echo "running: asc-push $MODE"
          # pipefail: `cmd | tee` otherwise reports TEE's exit status, so a
          # failed push would be a green job. The seed workflow shipped
          # exactly that bug and reported Success while the script printed a
          # 500 — caught on its first real run, and fixed in both places at
          # once because one instance of a mistake is rarely the only one.
          set -o pipefail
          # 2>&1 so STDERR reaches the log the summary prints. Without it the
          # summary showed the header, an empty block and "Dry run. Nothing
          # was written" — which reads as success-with-no-changes while the
          # script had actually died on a 400. A summary that cannot show a
          # failure is worse than no summary.
          node scripts/asc-push.mjs $MODE 2>&1 | tee "$RUNNER_TEMP/asc.log"

      - name: Summary
        if: always()
        run: |
          {
            echo "### App Store metadata — \`${{ inputs.what }}\`"
            echo ""
            # The failure branch comes FIRST, because it was missing and that
            # cost a debugging round: a failed run printed "Dry run. Nothing
            # was written" above an empty block, which reads as
            # success-with-no-changes. A summary must never describe an
            # outcome the job did not have.
            if [ "${{ job.status }}" != "success" ]; then
              echo "**Failed.** Nothing was written. The error is below — if the block is"
              echo "empty, the step died before producing output and the step log has it."
            elif [ "${{ inputs.what }}" = "privacy (report only)" ]; then
              echo "**Report.** Apple's API cannot write the privacy label (D73), so this"
              echo "never writes whether *apply* is ticked or not. The form is printed"
              echo "below in the order App Store Connect asks — copy it across by hand,"
              echo "with \`docs/STORE-FORMS.md\` open."
            elif [ "${{ inputs.what }}" = "screenshots (report only)" ]; then
              echo "**Report.** Uploading needs captures on disk; use the **Screenshots**"
              echo "workflow, which captures and uploads in one run."
            elif [ "${{ inputs.apply }}" = "true" ]; then
              echo "**Applied.** App Store Connect now matches the repo for this selection."
            else
              echo "**Dry run.** Nothing was written. Re-run with *apply* ticked to write it."
            fi
            echo ""
            echo '```'
            cat "$RUNNER_TEMP/asc.log" 2>/dev/null || echo "(no output — the push step failed before running)"
            echo '```'
            echo ""
            echo "Still manual: the **privacy label** (Apple exposes no endpoint — D73; the"
            echo "form is printed above whenever the selection includes it), **screenshots**"
            echo "(the Screenshots workflow), and **submitting for review**, which stays a"
            echo "deliberate human click because it is the irreversible one."
          } >> "$GITHUB_STEP_SUMMARY"
