# Read production's own state (D292's observer, on the credential that is
# already here).
#
# WHY NOT WAIT FOR WORKLOAD IDENTITY FEDERATION. D292 designed a separate
# read-only `insight-observer` identity, and that is still the destination —
# it is least privilege, and this workflow is not. What it is NOT is a
# prerequisite: every reading here is an ordinary Google API call, and
# scripts/fn-log.mjs has been making exactly that kind of call against
# production with FIREBASE_SERVICE_ACCOUNT since D179.
#
# Waiting bought nothing and cost the obvious thing: for as long as runbook
# 5.13 went unrun, nobody could see whether the alerts were armed, whether
# the old region was empty, or what production actually held. On 2026-08-26
# that was long enough for every instrument in the repo to report zero
# answers over 108 real ones for fifteen days (D296).
#
# READ-ONLY BY CONSTRUCTION. Every call is a GET. There is no --apply, no
# input that changes anything, and no write path — which is why this needs
# no `environment: production` gate, unlike seed-content.yml and
# rebuild-aggregate.yml. A workflow that cannot change anything does not
# need a human in front of it.

name: Observe production

on:
  workflow_dispatch:
    inputs:
      functions:
        description: "Also list every deployed function with its trigger, generation and last deploy date"
        type: boolean
        default: false
      metrics:
        description: "Also report which monitored resource each log-based metric's series is written against (needed to write a policy filter)"
        type: boolean
        default: false
  schedule:
    # Daily, after the nightly functions have run and their logs have
    # settled. 06:11 UTC is deliberately off the hour: the scheduled folds
    # sit at :23, :37 and :47, and a reader that runs while they are writing
    # reports a half-finished night.
    - cron: "11 6 * * *"

permissions:
  contents: read

concurrency:
  group: observe
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Observe
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: prvfire33
        # pipefail, for the reason seed-content.yml records: `cmd | tee`
        # otherwise reports TEE's exit status, which is 0 whatever the
        # script did.
        #
        # This comment used to argue the opposite — "no pipefail dance
        # needed … only a broken credential or a broken script is an
        # error" — which is exactly the case it was masking. This script
        # exits 0 on a REFUSED reading on purpose (a missing role is the
        # answer, not a failure), and reserves exit 1 for the three things
        # that mean the probe did not happen at all: an empty or invalid
        # service account, a failed token exchange, and a broken region
        # scan. Without pipefail every one of those showed a green check.
        #
        # The instrument that exists because fifteen days of readings were
        # silently zero is not one to let report success while it is dead.
        # It runs on a daily cron and nobody watches the log.
        #
        # `functions` is type: boolean, so the only values that can reach the
        # shell are true and false — the same argument rebuild-aggregate.yml
        # makes at its own interpolation, stated here rather than left to be
        # inferred from the absence of an env indirection. The `[ … ] &&`
        # lines are safe under `set -e` for the ordinary reason: a first
        # command in an AND list is exempt from errexit (measured, not
        # assumed).
        run: |
          set -o pipefail
          ARGS=()
          [ "${{ inputs.functions }}" = "true" ] && ARGS+=(--functions)
          [ "${{ inputs.metrics }}" = "true" ] && ARGS+=(--metrics)
          node scripts/observe.mjs "${ARGS[@]}" --json-out "$RUNNER_TEMP/observe.json" 2>&1 | tee "$RUNNER_TEMP/observe.txt"

      # The same payload, machine-readable, for the production reader
      # workflow — which exists because a reader that parses the padded
      # `✓ alertPolicies  5 live` lines above is the one-parser-in-three-
      # copies failure D197 recorded (docs/USAGE-REDUCTION.md § 5). Uploaded
      # even when the probe failed: the reader's headline is "the probe did
      # not happen", and it can only say that if the absence is visible.
      - name: Publish the machine-readable reading
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: observe-json
          path: ${{ runner.temp }}/observe.json
          if-no-files-found: warn
          retention-days: 7

      - name: Summary
        if: always()
        run: |
          {
            echo "### Production, as it actually is"
            echo ""
            echo '```'
            cat "$RUNNER_TEMP/observe.txt" 2>/dev/null || echo "(the probe did not run — see the step log)"
            echo '```'
            echo ""
            echo "#### Reading it"
            echo ""
            echo "A **✗ denied** line is a ROLE missing from the deploy service account,"
            echo "not a code change and not an outage. The line names the exact role."
            echo ""
            echo "\`alertPolicies … NOT armed\` is runbook 5.5 undone: those policies each"
            echo "watch an ABSENCE, so until they exist a scheduled function can stop"
            echo "running and nothing says so."
            echo ""
            echo "\`us-central1 still holds N\` is runbook 5.9b / D13 — dropping a name from"
            echo "the deploy \`--only\` list stops deploying a function, it never deleted the"
            echo "copy already there."
          } >> "$GITHUB_STEP_SUMMARY"
