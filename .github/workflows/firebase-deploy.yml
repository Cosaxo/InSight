name: Deploy Firebase backend

on:
  push:
    branches: [main]
    paths:
      - "functions/**"
      - "firestore.rules"
      - "firestore.indexes.json"
      - "storage.rules"
      # The hosted legal pages. `web/`, not `public/` — hosting's public
      # dir moved when the pages came out of the Vite bundle, and this
      # trigger did not follow. The effect was silent and one-directional:
      # a commit that edited ONLY the privacy policy matched no path here,
      # so the deploy never ran and the live policy stayed stale while the
      # repo looked correct. For a page both stores treat as a submission
      # requirement, that is the wrong way round to fail.
      - "web/**"
      - "firebase.json"
      - ".github/workflows/firebase-deploy.yml"
  workflow_dispatch:

# The deploy step needs no repo write access; the SA key comes from
# secrets, not the GITHUB_TOKEN.
permissions:
  contents: read

# Never let two deploys interleave; a queued push waits for the
# in-flight deploy rather than cancelling it mid-apply.
concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  # Backend correctness, shared verbatim with ci.yml. This used to be the
  # rules suite alone, so a push that broke meetsKFloor, the duel-reveal
  # path or account deletion deployed while CI went red in parallel.
  #
  # Client-only checks (lint, bundle budget, Android) and the npm audit
  # stay OFF this path on purpose: none of them says anything about
  # backend correctness, and each could block an emergency rules fix.
  test:
    uses: ./.github/workflows/backend-checks.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    # GitHub environment: gives the deploy its own secrets scope and a
    # place to add required reviewers / wait timers later without
    # touching this file.
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          # This job installs both trees; cache on both lockfiles so the
          # functions install is cached too.
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      # Root deps bring the lockfile-pinned firebase-tools CLI.
      - name: Install dependencies
        run: npm ci

      - name: Install function dependencies
        run: npm ci --prefix functions

      - name: Build functions
        run: npm run build --prefix functions

      # Runtime env for the deployed functions. The CLI reads
      # functions/.env.<projectId> at deploy time and bakes it into each
      # function's runtime config. Both .env and .env.* are gitignored, so
      # CI is the only place this value can come from — without this step
      # SEED_ADMIN_UIDS is empty in production and assertOperator() denies
      # every operator callable, including the seedContentV2 that fills
      # the question bank. Project-scoped on purpose: a future non-prod
      # project must not inherit production operator uids.
      - name: Write functions runtime env
        env:
          SEED_ADMIN_UIDS: ${{ vars.SEED_ADMIN_UIDS }}
          MOD_UIDS: ${{ vars.MOD_UIDS }}
          APPCHECK_ENFORCE: ${{ vars.APPCHECK_ENFORCE }}
          DC_TEAM_ID: ${{ vars.DC_TEAM_ID }}
          DC_KEY_ID: ${{ vars.DC_KEY_ID }}
          # The .p8 contents — a SECRET, not a variable. Store it either
          # verbatim (real newlines) or \n-escaped; the write below
          # normalizes, and functions/src/deviceBind.ts unescapes.
          DC_PRIVATE_KEY: ${{ secrets.DC_PRIVATE_KEY }}
        run: |
          if [ -z "$SEED_ADMIN_UIDS" ]; then
            echo "::warning::SEED_ADMIN_UIDS is empty — seedContentV2, revealDuelsNowV2 and the rebuild* callables will return permission-denied. Set it on the production environment, then re-run via workflow_dispatch."
          fi
          printf 'SEED_ADMIN_UIDS=%s\n' "$SEED_ADMIN_UIDS" > functions/.env.prvfire33
          # MOD_UIDS is the moderation allowlist — deliberately separate
          # from SEED_ADMIN_UIDS (docs/MODERATION.md: a moderator identity
          # can moderate and do nothing else). Empty just means the two
          # moderation callables deny everyone, which is fail-safe.
          if [ -z "$MOD_UIDS" ]; then
            echo "::warning::MOD_UIDS is empty — fetchModQueue and submitModVerdict will return permission-denied for every caller."
          fi
          printf 'MOD_UIDS=%s\n' "$MOD_UIDS" >> functions/.env.prvfire33
          # Only ever write the escape hatch when it is explicitly "false";
          # any other value must leave App Check enforced by default.
          if [ "$APPCHECK_ENFORCE" = "false" ]; then
            echo "::warning::APPCHECK_ENFORCE=false — App Check enforcement is DISABLED for this deploy. Incident escape hatch only; unset the variable to restore enforcement."
            printf 'APPCHECK_ENFORCE=false\n' >> functions/.env.prvfire33
          fi
          # D29 device binding (docs/DEVICE-BIND.md §1): DeviceCheck
          # credentials for activateDeviceV2's iOS verifier. Empty means
          # iOS activation fails with failed-precondition — fail-safe
          # while rules enforcement is soft, warned so the gap is visible.
          if [ -z "$DC_PRIVATE_KEY" ]; then
            echo "::warning::DC_PRIVATE_KEY is empty — activateDeviceV2 cannot verify iOS devices yet (docs/DEVICE-BIND.md)."
          fi
          printf 'DC_TEAM_ID=%s\n' "$DC_TEAM_ID" >> functions/.env.prvfire33
          printf 'DC_KEY_ID=%s\n' "$DC_KEY_ID" >> functions/.env.prvfire33
          # Normalize real newlines to \n so the PEM survives dotenv's
          # one-line-per-value format; the function unescapes either way.
          printf 'DC_PRIVATE_KEY="%s"\n' "$(printf '%s' "$DC_PRIVATE_KEY" | sed ':a;N;$!ba;s/\n/\\n/g')" >> functions/.env.prvfire33

      - name: Write service account key
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa-key.json"

      # Separate from the main apply on purpose: the storage deploy fails if
      # the project has no Storage bucket provisioned, and that must not abort
      # the Firestore-rules + functions deploy. `continue-on-error` keeps a
      # missing bucket from failing the run while still surfacing it in the
      # job summary — check this step before assuming storage.rules is live.
      #
      # `--only storage`, NOT `--only storage:rules`: in firebase-tools the
      # colon form names a deploy *target* (the multi-bucket feature), so with
      # this repo's plain single-bucket config it errors with "Could not find
      # rules for the following storage targets: rules". That exact failure
      # ran silently under continue-on-error on every deploy until run
      # 30643945632's log was audited — storage.rules had never actually
      # shipped from here.
      - name: Deploy storage rules
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa-key.json
        run: npx firebase deploy --project prvfire33 --non-interactive --only "storage"

      # Rules and indexes go WITHOUT --force, and that is the whole point of
      # the split. --force is a deploy-wide flag, not a functions one: in
      # firebase-tools it sets `shouldDeleteIndexes` and `shouldDeleteFields`
      # (lib/firestore/api.js), so under --force this step deletes every index
      # and field override the project holds that firestore.indexes.json does
      # not — and that file names exactly one (the v2_takes list composite,
      # D65), so everything else the project holds is at risk.
      #
      # Two things the repo asks an operator to create by hand are exactly
      # that: the TTL on v2_agg_events.expireAt (LAUNCH-RUNBOOK §5.1,
      # SHIP-CHECKLIST — the 90-day retention bound D28 rests on) and the
      # composite index v2social.ts tells them to add if the duel scan ever
      # throws FAILED_PRECONDITION. Combined with --force, the next push
      # touching functions/** silently undid both, green.
      #
      # Non-interactive WITHOUT --force logs the would-be deletions and
      # continues, which is the direction this has to fail in. Enforced by
      # `npm run check:deploy-targets`.
      - name: Deploy rules + indexes
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa-key.json
        run: >
          npx firebase deploy --project prvfire33 --non-interactive
          --only "firestore:rules,firestore:indexes"

      # --force is required for non-interactive deploys of retry-enabled
      # triggers (docs/DEPLOYMENT.md) — and now reaches nothing but functions.
      - name: Deploy functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa-key.json
        run: >
          npx firebase deploy --project prvfire33 --non-interactive --force
          --only "functions:deleteAccount,functions:seedContentV2,functions:onV2AnswerCreated,functions:onV2AnswerUpdated,functions:createGroupV2,functions:joinGroupV2,functions:requestJoinV2,functions:approveJoinV2,functions:declineJoinV2,functions:leaveGroupV2,functions:claimHandleV2,functions:inviteToGroupV2,functions:acceptGroupInviteV2,functions:declineGroupInviteV2,functions:nearbyCountV2,functions:nearbyRoomV2,functions:registerPushToken,functions:scheduledDuelReveals,functions:revealDuelsNowV2,functions:buildModQueue,functions:buildModQueueNow,functions:fetchModQueue,functions:submitModVerdict,functions:activateDeviceV2,functions:ledgerVelocityScan,functions:logicStartV2,functions:logicSubmitV2,functions:suggestQuestionV2,functions:fetchSuggestionsV2,functions:reviewSuggestionV2,functions:resolveCallsV2,functions:fitPatternsV2,functions:digestEngagementV2"

      # The legal pages and the landing page they are reached from. Both
      # stores refuse a submission without a reachable privacy-policy URL,
      # so this is a launch dependency, not a website.
      #
      # LAST, and continue-on-error, for the same reason the storage step
      # is: nothing about static HTML should be able to abort — or worse,
      # half-abort — a Firestore-rules or functions deploy. Check this
      # step's outcome before assuming the policy URL is live.
      - name: Deploy hosting
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa-key.json
        run: npx firebase deploy --project prvfire33 --non-interactive --only "hosting"
