# Fold every existing answer into the per-person answer maps the Circle stop
# reads (DATA-EFFICIENCY-RUNBOOK 3.4) — once, after the trigger that keeps
# them live has deployed.
#
# WHY THIS EXISTS. `backfillAnswerMapsV2` is an operator callable, and an
# operator callable with no way to run it is a step that does not get
# performed (rebuild-aggregate.yml's header has the argument in full). This
# is that file's shape, pointed at the migration: the same credentials, the
# same environment protection (D87), the same dry-by-default rule.
#
# WHAT IT DOES. Reads every answer document once (a read per answer) and
# writes one merged map per person per page of the scan. Idempotent and
# resumable — a run that stops is continued with the cursor its summary
# prints, never restarted. Until it has run, a Circle member without a map
# is read the old way (one query per member), so nothing goes dark in
# between; after it, every member is one document.
#
# NEVER AUTOMATIC. `workflow_dispatch` only, `apply` off unless asked.

name: Backfill answer maps

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "WRITE the maps. Off = count what would be written and change nothing."
        type: boolean
        default: false
      after:
        description: "Resume after this answer document path (from a stopped run's summary). Empty = from the start."
        type: string
        required: false
        default: ""

permissions:
  contents: read

# Two backfills at once would each merge the same maps — harmless, since a
# merge of what is already there changes nothing, but a wasted read of the
# whole collection. Refuse the second rather than let it start.
concurrency:
  group: backfill-answer-maps
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    # The scan is a read per existing answer, paged by a callable that hands
    # its cursor back near its own deadline; the loop here runs until the
    # end. Generous, and a stopped run resumes from its cursor.
    timeout-minutes: 120
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Backfill
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SEED_ADMIN_UIDS: ${{ vars.SEED_ADMIN_UIDS }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: prvfire33
          AFTER: ${{ inputs.after }}
        run: |
          # pipefail and the environment for the free-text input, for the
          # reasons rebuild-aggregate.yml records at this same step.
          set -o pipefail
          ARGS=""
          [ -n "$AFTER" ] && ARGS="$ARGS --after $AFTER"
          [ "${{ inputs.apply }}" = "true" ] && ARGS="$ARGS --apply"
          node scripts/backfill-answer-maps.mjs $ARGS 2>&1 | tee "$RUNNER_TEMP/backfill.log"

      - name: Why it failed — the function's own log
        if: failure()
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: prvfire33
        run: |
          node scripts/fn-log.mjs --fn backfillAnswerMapsV2 --minutes 180 --limit 40 --all-severities \
            2>&1 | tee "$RUNNER_TEMP/fnlog.txt"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Backfill answer maps"
            echo ""
            if [ "${{ inputs.apply }}" = "true" ]; then
              echo "**APPLIED.** Every existing world answer is in its person's map."
            else
              echo "**Dry run.** Nothing was written."
            fi
            echo ""
            echo '```'
            cat "$RUNNER_TEMP/backfill.log" 2>/dev/null || echo "(failed before the backfill ran — see the step log)"
            echo '```'
            if [ -s "$RUNNER_TEMP/fnlog.txt" ]; then
              echo ""
              echo "#### backfillAnswerMapsV2's own log"
              echo ""
              echo '```'
              cat "$RUNNER_TEMP/fnlog.txt"
              echo '```'
            fi
            echo ""
            echo "#### Reading it"
            echo ""
            echo "\`folded\` should equal the number of world answers with an option index;"
            echo "\`scanned\` is every answer document, catalogue picks and duel answers"
            echo "included. A run that stopped prints the cursor to resume after — pass it"
            echo "as \`after\`, never start over."
          } >> "$GITHUB_STEP_SUMMARY"
